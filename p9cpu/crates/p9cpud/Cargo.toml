[package]
name = "p9cpud"
version = "0.1.0"
edition = "2024"
resolver = "1"

[[bin]]
name = "p9cpud"
path = "src/p9cpud.rs"


[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread","process","io-std", "fs"] }
tokio-vsock = { version = "0.4", features = ["tonic-conn"] }
vsock = "0.3.0"
async-trait = "0.1.92"
russh-keys = "0.49.2"
log = "0.4.35"
env_logger = "0.11.11"
russh = "0.65.1"
rand = { version = "0.10", features = ["thread_rng"] }
ssh-key = { version = "0.7.0-rc.11"}
nix = {version = "0.31.3", features = ["term", "process", "fs"] }
bytes = "1.12.1"
rand_core = { version = "0.10.1"}
